name: strumline

# ---------------------------------------------------------------------------
# One image, three process containers, PostgreSQL, Loki, Prometheus, Grafana.
#
# Build:    docker compose build
# Start:    docker compose up -d
# CLI:      docker compose run --rm strumline-cli strumline <command>
# ---------------------------------------------------------------------------

x-db-location-env: &db-location-env
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: "${DB_NAME:-strumline}"

x-db-env: &db-env
  <<: *db-location-env
  DB_USER: "${DB_USER:-strumline}"
  DB_PASSWORD: "${DB_PASSWORD:-strumline}"

x-ingest-db-env: &ingest-db-env
  INGEST_DB_USER: "${INGEST_DB_USER:-strumline_ingest}"
  INGEST_DB_PASSWORD: "${INGEST_DB_PASSWORD:-}"

x-common-env: &common-env
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  METRICS_ENABLED: "${METRICS_ENABLED:-true}"
  APP_TIMEZONE: "${APP_TIMEZONE:-}"
  APP_KEY: "${APP_KEY:-}"
  API_DOCS_ENABLED: "${API_DOCS_ENABLED:-false}"

x-api-env: &api-env
  API_DOCS_ENABLED: "${API_DOCS_ENABLED:-false}"
  ADMIN_API_ENABLED: "${ADMIN_API_ENABLED:-false}"
  ADMIN_API_KEY: "${ADMIN_API_KEY:-}"

x-sink-env: &sink-env
  SINK_PROVIDER: "${SINK_PROVIDER:-loki}"
  LOKI_URL: "${LOKI_URL:-http://loki:3100}"
  LOKI_TIMEOUT_SECONDS: "${LOKI_TIMEOUT_SECONDS:-5}"
  LOKI_COMPRESSION: "${LOKI_COMPRESSION:-gzip}"

services:

  # --------------------------------------------------------------------------
  # API — control plane health endpoint (:8000)
  # --------------------------------------------------------------------------
  api:
    image: strumline:${STRUMLINE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${STRUMLINE_TARGET:-dev}
    command: >
      uvicorn strumline.api.server:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/strumline
    environment:
      <<: [ *common-env, *db-env, *api-env ]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./strumline:/app/strumline:ro
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: [
        "CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Ingest — HTTP receiver and IPC writer (:8001)
  # --------------------------------------------------------------------------
  ingest:
    image: strumline:${STRUMLINE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${STRUMLINE_TARGET:-dev}
    command: >
      uvicorn strumline.ingest.server:app
      --host 0.0.0.0 --port 8001
      --reload --reload-dir /app/strumline
    environment:
      <<: [ *common-env, *db-location-env, *ingest-db-env ]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ipc-socket:/var/run/strumline
      - ./strumline:/app/strumline:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Processor — IPC reader, batching, sink dispatch (:8002, localhost only)
  # --------------------------------------------------------------------------
  processor:
    image: strumline:${STRUMLINE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${STRUMLINE_TARGET:-dev}
    command: strumline-processor
    environment:
      <<: [ *common-env, *sink-env ]
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ipc-socket:/var/run/strumline
      - ./strumline:/app/strumline:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Disposable CLI — run migrations and control-plane commands
  # Usage: docker compose run --rm strumline-cli strumline <command>
  # --------------------------------------------------------------------------
  strumline-cli:
    image: strumline:${STRUMLINE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${STRUMLINE_TARGET:-dev}
    profiles:
      - cli
    environment:
      <<: [ *common-env, *db-env, *ingest-db-env ]
    volumes:
      - ./strumline:/app/strumline:ro
      # Dev-only: makes `make benchmarks` runnable in the CLI container. The
      # benchmark harness is never copied into the runtime image.
      - ./benchmarks:/app/benchmarks
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # PostgreSQL — control-plane metadata store
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: "${DB_NAME:-strumline}"
      POSTGRES_USER: "${DB_USER:-strumline}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-strumline}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-strumline} -d ${DB_NAME:-strumline}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Loki — bundled development log aggregation backend
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.8
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    healthcheck:
      disable: true
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Prometheus + Grafana — metrics and dashboards
  #
  # Prometheus: http://localhost:9090
  # Grafana:    http://localhost:3000  (admin / admin)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-john.doe}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-changeme}"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  ipc-socket:
  postgres-data:
  loki-data:
  prometheus-data:
  grafana-data:
