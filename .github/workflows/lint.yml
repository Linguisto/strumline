name: Pull request gates

on:
  pull_request:

permissions:
  contents: read

env:
  INGEST_DB_PASSWORD: ci-read-only-placeholder
  OTELCOL_VERSION: "0.162.0"

jobs:
  lint-and-test:
    name: Lint and full test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: strumline
          POSTGRES_USER: strumline
          POSTGRES_PASSWORD: strumline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strumline -d strumline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - name: Install pinned OpenTelemetry Collector
        run: |
          archive="otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sha256" "$base/$archive.sha256"
          echo "$(cat "$archive.sha256")  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/otelcol"
          tar -xzf "$archive" -C "$RUNNER_TEMP/otelcol" otelcol-contrib
          echo "OTELCOL_BINARY=$RUNNER_TEMP/otelcol/otelcol-contrib" >> "$GITHUB_ENV"
      - name: Lint, format, types, and boundaries
        run: make lint DC_EXEC="uv run"
      - name: Full test suite
        run: uv run pytest --tb=short
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: strumline
          DB_USER: strumline
          DB_PASSWORD: strumline

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
