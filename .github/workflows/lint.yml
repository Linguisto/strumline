name: Lint & Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: telemetria
          POSTGRES_PASSWORD: telemetria
          POSTGRES_DB: telemetria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: telemetria
      DB_USER: telemetria
      DB_PASSWORD: telemetria

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff — lint
        run: uv run ruff check telemetria/ tests/

      - name: Ruff — format check
        run: uv run ruff format --check telemetria/ tests/

      - name: mypy — type check
        run: uv run mypy telemetria/

      - name: import-linter — boundary check
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest --tb=short
