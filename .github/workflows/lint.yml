name: Lint & Test

on:
  pull_request:

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff — lint
        run: uv run ruff check telemetria/ tests/

      - name: Ruff — format check
        run: uv run ruff format --check telemetria/ tests/

      - name: mypy — type check
        run: uv run mypy telemetria/

      - name: import-linter — boundary check
        run: uv run lint-imports

      - name: pytest (unit tests only)
        run: uv run pytest -m unit --tb=short
