name: CI

on:
  push:
    branches: ["main"]

jobs:
  test-in-container:
    name: Build & test (Docker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up compose stack (dev)
        run: |
          cp docker/compose.example.yaml compose.yaml
          cp docker/compose.dev.yaml docker-compose.override.yaml

      - name: Build dev image
        run: make build.dev

      - name: Start postgres
        run: docker compose up -d postgres
        env:
          TELEMETRIA_IMAGE_TAG: dev

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U telemetria && break
            sleep 1
          done

      - name: Run tests
        run: make test
        env:
          TELEMETRIA_IMAGE_TAG: dev

      - name: Validate compose config
        run: docker compose config --quiet
