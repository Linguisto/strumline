name: CI

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff — lint
        run: uv run ruff check strumline/ tests/

      - name: Ruff — format check
        run: uv run ruff format --check strumline/ tests/

      - name: mypy — type check
        run: uv run mypy strumline/

      - name: import-linter — boundary check
        run: uv run lint-imports

  build:
    name: Build dev image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create .env
        run: make init

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          push: false
          tags: strumline:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=strumline-dev.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: strumline-dev
          path: strumline-dev.tar.gz
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Create .env
        run: make init

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: strumline-dev

      - name: Load image
        run: docker load < strumline-dev.tar.gz

      - name: Start postgres
        run: STRUMLINE_IMAGE_TAG=dev docker compose up -d postgres

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U strumline && break
            sleep 1
          done

      - name: Run full test suite
        run: make test
        env:
          STRUMLINE_IMAGE_TAG: dev

  push:
    name: Push dev image (multi-arch)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set lowercase image name
        run: echo "IMAGE_LC=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_LC }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
