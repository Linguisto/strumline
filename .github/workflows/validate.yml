name: Reusable validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Exact commit validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: strumline
          POSTGRES_USER: strumline
          POSTGRES_PASSWORD: strumline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strumline -d strumline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INGEST_DB_PASSWORD: ci-read-only-placeholder
      OTELCOL_VERSION: "0.162.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - name: Install pinned OpenTelemetry Collector
        run: |
          archive="otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sha256" "$base/$archive.sha256"
          echo "$(cat "$archive.sha256")  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/otelcol"
          tar -xzf "$archive" -C "$RUNNER_TEMP/otelcol" otelcol-contrib
          echo "OTELCOL_BINARY=$RUNNER_TEMP/otelcol/otelcol-contrib" >> "$GITHUB_ENV"
      - run: make lint DC_EXEC="uv run"
      - run: uv run pytest --tb=short
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: strumline
          DB_USER: strumline
          DB_PASSWORD: strumline
      - name: Build and smoke-test production image
        run: |
          docker build --target runtime --tag strumline:release-candidate --file docker/Dockerfile .
          docker run --rm strumline:release-candidate strumline --version
      - name: End-to-end release smoke test
        run: |
          smoke_env="$RUNNER_TEMP/release-smoke.env"
          cp .env.example "$smoke_env"
          sed -i "s/^APP_KEY=$/APP_KEY=$(openssl rand -hex 32)/" "$smoke_env"
          sed -i "s/^INGEST_DB_PASSWORD=$/INGEST_DB_PASSWORD=$(openssl rand -hex 32)/" "$smoke_env"
          SMOKE_ENV_FILE="$smoke_env" scripts/release-smoke.sh
