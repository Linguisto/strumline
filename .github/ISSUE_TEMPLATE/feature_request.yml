name: Feature request
description: Propose a focused improvement to Strumline.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contract
    attributes:
      label: Product contract
      options:
        - label: I have considered Strumline's best-effort delivery model and current roadmap.
          required: true
