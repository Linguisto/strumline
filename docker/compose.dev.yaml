# docker/compose.dev.yaml
#
# Development override — builds the dev image stage (includes pytest, ruff,
# mypy) and bind-mounts live source for uvicorn --reload.
#
# Copy to docker-compose.override.yaml in the project root:
#
#   cp docker/compose.dev.yaml docker-compose.override.yaml
#
# Or run: make init.dev
#
# docker compose automatically merges docker-compose.override.yaml at startup.

x-dev-build: &dev-build
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev

services:
  api:
    <<: *dev-build
    volumes:
      - ./telemetria:/app/telemetria:ro
    command:
      - uvicorn
      - telemetria.api.server:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/telemetria

  ingest:
    <<: *dev-build
    volumes:
      - ./telemetria:/app/telemetria:ro
    command:
      - uvicorn
      - telemetria.ingest.server:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - /app/telemetria

  processor:
    <<: *dev-build
    volumes:
      - ./telemetria:/app/telemetria:ro
    command:
      - uvicorn
      - telemetria.processor.server:app
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
      - --reload
      - --reload-dir
      - /app/telemetria

  telemetria-cli:
    <<: *dev-build
    environment:
      TESTING_DB_HOST: "${DB_HOST:-postgres}"
      TESTING_DB_PORT: "${DB_PORT:-5432}"
      TESTING_DB_NAME: "${TESTING_DB_NAME:-test_db}"
      TESTING_DB_USER: "${DB_USER:-telemetria}"
      TESTING_DB_PASSWORD: "${DB_PASSWORD:-telemetria}"
    volumes:
      - ./telemetria:/app/telemetria:ro
      - ./tests:/app/tests:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
