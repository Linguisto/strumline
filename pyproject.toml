[build-system]
requires = ["hatchling>=1.32.3"]
build-backend = "hatchling.build"

[project]
name = "strumline"
version = "1.0.0"
description = "Non-blocking, lightning-fast structured telemetry collector"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Linguisto" }]
keywords = ["opentelemetry", "otlp", "logging", "telemetry", "loki"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "httpx2>=2.13.1",
    "prometheus-client>=0.26.0",
    "textual>=8.2.8",
    "questionary>=2.1.1",
    "scalar-fastapi>=1.9.0",
    "opentelemetry-proto>=1.44.0",
    "googleapis-common-protos>=1.75.3",
    "protobuf>=7.36.2",
    "psycopg2-binary>=2.9.13",
]

[project.urls]
Homepage = "https://github.com/Linguisto/telemetria"
Repository = "https://github.com/Linguisto/telemetria"
Issues = "https://github.com/Linguisto/telemetria/issues"
Changelog = "https://github.com/Linguisto/telemetria/releases"

[project.scripts]
strumline = "strumline.cli.main:app"
strumline-api = "strumline.api.server:main"
strumline-ingest = "strumline.ingest.server:main"
strumline-processor = "strumline.processor.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "import-linter>=2.15",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[tool.hatch.build.targets.wheel]
packages = ["strumline"]

[tool.hatch.build]
include = ["strumline/**", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, DB-free tests",
    "integration: tests that require a running database",
]

# Named suites — invoke as: uv run pytest --co -q (list) or via make targets
# make test-unit        → pytest -m unit
# make test-integration → pytest -m integration  
# make test             → pytest (all)

[tool.importlinter]
root_packages = ["strumline"]

[[tool.importlinter.contracts]]
name = "ipc does not import process packages"
type = "forbidden"
source_modules = ["strumline.ipc"]
forbidden_modules = [
    "strumline.api",
    "strumline.cli",
    "strumline.ingest",
    "strumline.processor",
]

[[tool.importlinter.contracts]]
name = "domain is pure — no I/O dependencies"
type = "forbidden"
source_modules = ["strumline.domain"]
forbidden_modules = [
    "strumline.api",
    "strumline.cli",
    "strumline.ingest",
    "strumline.processor",
    "strumline.ipc",
    "strumline.metrics",
]

[[tool.importlinter.contracts]]
name = "processor does not import sink implementations directly"
type = "forbidden"
source_modules = ["strumline.processor"]
forbidden_modules = [
    "strumline.sinks.loki",
]

[[tool.importlinter.contracts]]
name = "ipc imports only domain code"
type = "forbidden"
source_modules = ["strumline.ipc"]
forbidden_modules = [
    "strumline.api",
    "strumline.cli",
    "strumline.config",
    "strumline.control",
    "strumline.db",
    "strumline.ingest",
    "strumline.logging_config",
    "strumline.metrics",
    "strumline.processor",
    "strumline.sinks",
]

[[tool.importlinter.contracts]]
name = "ingest does not depend on control plane or processor"
type = "forbidden"
source_modules = ["strumline.ingest"]
forbidden_modules = [
    "strumline.api",
    "strumline.cli",
    "strumline.control",
    "strumline.processor",
    "strumline.sinks",
]

[[tool.importlinter.contracts]]
name = "processor does not depend on control plane, database, or ingest"
type = "forbidden"
source_modules = ["strumline.processor"]
forbidden_modules = [
    "strumline.api",
    "strumline.cli",
    "strumline.control",
    "strumline.db",
    "strumline.ingest",
]

[[tool.importlinter.contracts]]
name = "control depends only on database and domain packages"
type = "forbidden"
source_modules = ["strumline.control"]
forbidden_modules = [
    "strumline.api",
    "strumline.cli",
    "strumline.config",
    "strumline.ingest",
    "strumline.ipc",
    "strumline.logging_config",
    "strumline.metrics",
    "strumline.processor",
    "strumline.sinks",
]

[[tool.importlinter.contracts]]
name = "cli does not depend on data-plane packages"
type = "forbidden"
source_modules = ["strumline.cli"]
forbidden_modules = [
    "strumline.api",
    "strumline.ingest",
    "strumline.ipc",
    "strumline.metrics",
    "strumline.processor",
    "strumline.sinks",
]

[[tool.importlinter.contracts]]
name = "api does not depend on data-plane packages"
type = "forbidden"
source_modules = ["strumline.api"]
forbidden_modules = [
    "strumline.cli",
    "strumline.ingest",
    "strumline.ipc",
    "strumline.processor",
    "strumline.sinks",
]

[[tool.importlinter.contracts]]
name = "sinks do not depend on process or persistence packages"
type = "forbidden"
source_modules = ["strumline.sinks"]
forbidden_modules = [
    "strumline.api",
    "strumline.cli",
    "strumline.control",
    "strumline.db",
    "strumline.ingest",
    "strumline.ipc",
    "strumline.metrics",
    "strumline.processor",
]
