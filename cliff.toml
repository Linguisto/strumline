[changelog]
header = """
# Changelog

All notable changes to Strumline will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}]({% if previous is defined %}https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}{% else %}https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/releases/tag/{{ version }}{% endif %}) - _{{ timestamp | date(format="%Y-%m-%d") }}_
{% else %}
## [Unreleased]()
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits | unique(attribute="message") %}
* {% if commit.scope %}[{{ commit.scope }}] {% endif %}{{ commit.message
    | replace(from="\r\n", to="\n")
    | replace(from="\n", to=" ")
    | trim
    | upper_first }}
{%- endfor %}

{% endfor %}
---

"""
trim = true
render_always = true

postprocessors = [
    { pattern = "([^\n])\n(### )", replace = "$1\n\n$2" },
    { pattern = "\n{3,}", replace = "\n\n" },
    { pattern = "[ \t]+$", replace = "" }
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = true
fail_on_unmatched_commit = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"

commit_parsers = [
    { body = ".*BREAKING CHANGE:.*", group = "Breaking changes" },
    { message = "(?i)^feat", group = "Added" },
    { message = "(?i)^fix", group = "Fixed" },
    { message = "(?i)^perf", group = "Changed" },
    { message = "(?i)^refactor", group = "Changed" },
    { message = "(?i)^revert", group = "Changed" },
    { message = "(?i)^remove", group = "Removed" },
    { message = "(?i)^delete", group = "Removed" },
    { message = "(?i)^deprecate", group = "Deprecated" },
    { body = "(?i).*security.*", group = "Security" },
    { message = "(?i)^docs", skip = true },
    { message = "(?i)^test", skip = true },
    { message = "(?i)^style", skip = true },
    { message = "(?i)^build", skip = true },
    { message = "(?i)^ci", skip = true },
    { message = "(?i)^chore", skip = true }
]
